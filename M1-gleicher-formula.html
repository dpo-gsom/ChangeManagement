<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Где слабое звено</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ─── Экран: фиксированная высота, чтобы iframe не прыгал ─── */
  .screen { min-height: 970px; }
  /* Кнопка идёт сразу под контентом, запас высоты остаётся под ней */
  .screen__body { display: flex; flex-direction: column; }

  /* ─── Кейс ─── */
  .case-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--dark); line-height: 1.25; margin-bottom: 6px; }
  .case-text { font-size: 14px; line-height: 1.6; color: var(--slate); }
  .step-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--red); margin-bottom: 4px; }

  /* ─── Реплики ─── */
  .quotes { display: flex; flex-direction: column; gap: 2px; }
  .quote { display: flex; gap: 10px; align-items: flex-start; padding: 5px 8px; border-radius: var(--radius-sm); font-size: 14px; line-height: 1.5; color: var(--slate); transition: background 0.25s; }
  .quote__who { font-weight: 600; color: var(--dark); }
  .quote__tag {
    width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px;
    border: 1.5px dashed var(--border); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 12px; font-weight: 700; color: transparent;
  }
  .quote--tagged .quote__tag { border-style: solid; background: var(--sand); color: var(--slate); }
  .quote--weak { background: var(--red-bg); }
  .quote--weak .quote__tag { background: var(--red); border-color: var(--red); color: var(--white); }

  /* ─── Формула ─── */
  .task-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
  .formula { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--red); white-space: nowrap; line-height: 1.3; }
  .formula .f { padding: 0 3px; border-radius: 4px; transition: background 0.25s, color 0.25s; }
  .formula .f--weak { background: var(--red); color: var(--white); }

  /* ─── Шкалы ─── */
  .scales { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .scale__head { font-size: 13px; color: var(--dark); margin-bottom: 5px; line-height: 1.3; }
  .scale__head b { font-family: var(--font-display); color: var(--red); margin-right: 5px; font-size: 15px; }
  .seg { display: flex; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button {
    flex: 1; border: none; border-left: 1px solid var(--border); background: none;
    font-family: var(--font-body); font-size: 12px; color: var(--slate);
    padding: 8px 4px; cursor: pointer; transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:first-child { border-left: none; }
  .seg button:hover { background: var(--sand); }
  .seg button.on { background: var(--dark); color: var(--white); }
  .seg--locked button { cursor: default; pointer-events: none; }
  .seg--locked button.on.ok   { background: var(--green-bg); color: var(--green); font-weight: 600; }
  .seg--locked button.on.warn { background: var(--amber-bg); color: var(--amber); font-weight: 600; }
  .seg--locked button.on.bad  { background: var(--red-bg);   color: var(--red);   font-weight: 600; }
  .seg--locked button.right   { box-shadow: inset 0 0 0 2px var(--green); color: var(--green); font-weight: 600; }

  /* ─── Варианты действий ─── */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt { padding: 12px 14px; font-size: 14px; line-height: 1.45; color: var(--dark); }
  .opt--locked { cursor: default; pointer-events: none; }

  /* ─── Зона разбора ─── */
  .fb-zone { min-height: 147px; }
  .fb-zone .hint {
    font-size: 13px;
    color: var(--slate);
    text-align: center;
    padding: 18px 10px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-md);
  }

  /* ─── Вводный экран ─── */
  .formula--big { font-size: 28px; }
  .formula-note { font-size: 13px; color: var(--slate); margin-top: 2px; }
  .legend-list { display: flex; flex-direction: column; gap: 6px; }
  .legend-row { display: flex; gap: 10px; font-size: 14px; line-height: 1.5; color: var(--slate); }
  .legend-row b { font-family: var(--font-display); color: var(--red); width: 16px; flex-shrink: 0; font-size: 16px; }

  /* ─── Итог ─── */
  .sum-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .sum-row:last-child { border-bottom: none; }
  .sum-row__name { flex: 1; color: var(--dark); line-height: 1.35; }
  .sum-row__name small { display: block; font-size: 12px; color: var(--slate); }
  .mark { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .mark--ok   { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
  .mark--warn { background: var(--amber-bg); border: 1.5px solid var(--amber); color: var(--amber); }
  .mark--bad  { background: var(--red-bg);   border: 1.5px solid var(--red);   color: var(--red);   }
  .sum-head { display: flex; gap: 10px; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--slate); }
  .sum-head span:first-child { flex: 1; }
  .sum-verdict { font-size: 14px; line-height: 1.65; color: var(--slate); }
  .sum-verdict b { color: var(--dark); }

  @media (max-width: 560px) {
    .screen { min-height: 1370px; }
    .scales { grid-template-columns: 1fr; gap: 10px; }
    .fb-zone { min-height: 261px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   Где слабое звено: формула Глейчера C = (A × B × D) > X
   Модуль 1 · четыре компании, в каждой два шага:
   (1) по репликам оценить A, B, D и X,
   (2) решить, что делать руководителю (работать с самым слабым)
   ========================================================= */

var FACTORS = ['A', 'B', 'D', 'X'];
var FNAME = { A: 'Недовольство', B: 'Образ будущего', D: 'Практическая полезность', X: 'Цена изменений' };
var FWEAK = { A: 'недовольство (A)', B: 'образ будущего (B)', D: 'практическая полезность (D)' };
var LEVELS = ['Почти ноль', 'Средний', 'Высокий'];
var LEVELS_X = ['Низкая', 'Средняя', 'Высокая'];

/* lv: 0 — почти ноль (низкая), 1 — средний, 2 — высокий
   f у реплики — к какой величине она относится
   level у варианта: ok — верно, warn — допустимо, но не лучший, bad — неверно */
var CASES = [
  {
    title: 'Склад',
    text: 'Оптовая компания хочет перевести склад с бумажных накладных на электронный учёт. Директор по логистике собрал кладовщиков и старших смен, чтобы обсудить переход.',
    quotes: [
      { who: 'Старший смены', t: '«Каждый месяц по два дня ищем расхождения в накладных. Надоело».', f: 'A' },
      { who: 'Кладовщик', t: '«А что изменится? Будем набивать то же самое, только в компьютер».', f: 'B' },
      { who: 'Старшая смены', t: '«Как это будет выглядеть у нас, никто не показывал. Сказали только, что так современнее».', f: 'B' },
      { who: 'Директор по логистике', t: '«Поставщик системы обещает всё настроить, но с какой зоны начинать, мы пока не решили».', f: 'D' },
      { who: 'Кладовщик', t: '«Значит, месяц будем работать дважды: и на бумаге, и в системе».', f: 'X' }
    ],
    lv: { A: 2, B: 0, D: 1, X: 1 },
    weak: 'B',
    diag: 'Недовольства хватает: люди сами называют, что не так. А образа будущего почти нет — «то же самое, только в компьютер». Первые шаги и цена средние. По формуле шансы невелики: один множитель близок к нулю, и сильное недовольство его не перекроет.',
    options: [
      { t: 'Собрать цифры о потерях из-за бумажного учёта и показать их на общем собрании', level: 'bad',
        fb: 'Недовольство и так высокое: проблемы люди называют сами. Новые цифры о том, как плохо сейчас, не ответят на их вопрос «а что изменится?».' },
      { t: 'Показать, как изменится смена: съездить с кладовщиками на склад, где учёт уже электронный, и посмотреть, сколько там занимают приёмка и сверка', level: 'ok',
        fb: 'Слабое звено — образ будущего: люди не видят, чем станет лучше лично им. Его и нужно усиливать.' },
      { t: 'Расписать подробный план перехода по неделям и раздать его сменам', level: 'warn',
        fb: 'План сделает первые шаги понятнее, но слабое звено не здесь. Пока люди не видят, чем будет лучше, план они воспримут как ещё одну обязанность. Сначала — образ будущего.' }
    ]
  },
  {
    title: 'Отдел продаж',
    text: 'Производитель офисной мебели хочет, чтобы менеджеры по продажам не обзванивали незнакомые компании, а вели закреплённых за ними постоянных клиентов. Коммерческий директор показал команде презентацию.',
    quotes: [
      { who: 'Коммерческий директор', t: '«Представьте: у каждого свои клиенты, понятный доход и никаких звонков незнакомым людям».', f: 'B' },
      { who: 'Менеджер', t: '«Звучит красиво. Но зачем? План мы выполняем третий год, премии платят».', f: 'A' },
      { who: 'Старший менеджер', t: '«Мне и сейчас нормально. Свои звонки я знаю наизусть».', f: 'A' },
      { who: 'Руководитель отдела', t: '«Переходить можно постепенно: сначала закрепим за каждым по пять клиентов».', f: 'D' },
      { who: 'Менеджер', t: '«Первые полгода премии, наверное, будут меньше, пока клиентов не наберём».', f: 'X' }
    ],
    lv: { A: 0, B: 2, D: 2, X: 1 },
    weak: 'A',
    diag: 'Образ будущего яркий, первые шаги понятные: переходить можно постепенно. Но людей устраивает настоящее — план выполняют, премии платят. Недовольство почти ноль, и по формуле это тянет вниз весь результат, какой бы привлекательной ни была цель.',
    options: [
      { t: 'Сделать вторую презентацию, ещё ярче, с примерами компаний, которые уже так работают', level: 'bad',
        fb: 'Образ будущего и так привлекательный: «звучит красиво». Наращивать его нет смысла — людей устраивает настоящее.' },
      { t: 'Объявить переход обязательным с первого числа: план выполняют, справятся и с новым', level: 'bad',
        fb: 'Приказ не сделает нынешнее положение менее удобным. Люди будут ждать, когда можно вернуться к старому. Работать нужно с недовольством.' },
      { t: 'Разобрать с командой, где нынешняя схема их подводит: сколько звонков уходит впустую и что будет с премией, если рынок просядет', level: 'ok',
        fb: 'Слабое звено — недовольство: людей устраивает настоящее. Помогите им увидеть, чем нынешняя схема неудобна или рискованна лично для них.' }
    ]
  },
  {
    title: 'Бухгалтерия',
    text: 'Сеть клиник переводит бухгалтерию на новую учётную систему. Финансовый директор предлагает перейти за одни выходные в конце квартала и сразу отключить старую систему, чтобы никто не цеплялся за привычное.',
    quotes: [
      { who: 'Главный бухгалтер', t: '«Старая система виснет каждый день, отчёты собираем вручную. Мы давно просим замену».', f: 'A' },
      { who: 'Бухгалтер', t: '«В новой отчёт формируется одной кнопкой. Я видела у знакомых — совсем другая жизнь».', f: 'B' },
      { who: 'Бухгалтер', t: '«А если в понедельник что-то не сойдётся? Вернуться к старой уже не получится».', f: 'D' },
      { who: 'Главный бухгалтер', t: '«Как переносить остатки, никто не объяснил. Инструкции обещают дать по ходу».', f: 'D' },
      { who: 'Бухгалтер', t: '«Значит, конец квартала без выходных и, скорее всего, ночами».', f: 'X' }
    ],
    lv: { A: 2, B: 2, D: 0, X: 2 },
    weak: 'D',
    diag: 'Недовольство и образ будущего высокие: старая система мешает, новую видели и хотят. Но первый шаг рискованный и непонятный: вернуться назад нельзя, как переносить остатки, неизвестно. Цена тоже высокая. По формуле слабое звено — практическая полезность, и она тянет вниз весь результат.',
    options: [
      { t: 'Сначала перевести одну клинику, старую систему оставить на квартал параллельно и заранее расписать, кто и как переносит остатки', level: 'ok',
        fb: 'Слабое звено — практическая полезность: первые шаги выглядят рискованно и непонятно. Пилот и возможность вернуться назад делают ошибку поправимой.' },
      { t: 'Устроить бухгалтерам демонстрацию новой системы, чтобы они увидели, насколько с ней удобнее', level: 'bad',
        fb: 'Бухгалтеры уже знают, что новая система удобнее, — «совсем другая жизнь». Образ будущего наращивать не нужно, людей пугает сам переход.' },
      { t: 'Сдвинуть переход на середину квартала, чтобы он не совпал с отчётностью, а остальной план оставить', level: 'warn',
        fb: 'Так работать придётся меньше, но переход всё так же без пути назад и без понятного переноса остатков. Слабое звено — первые шаги, с ними и нужно работать.' }
    ]
  },
  {
    title: 'Сервисная служба',
    text: 'Служба ремонта бытовой техники хочет записывать клиентов не «на день», а на двухчасовые интервалы. Руководитель сервиса обсуждает это с мастерами и диспетчерами.',
    quotes: [
      { who: 'Мастер', t: '«Клиенты злятся, что ждут весь день, и мы выслушиваем это на каждом вызове».', f: 'A' },
      { who: 'Диспетчер', t: '«Половина звонков — „где мастер?“. Работать невозможно».', f: 'A' },
      { who: 'Мастер', t: '«Если будет понятный маршрут на день, я наконец буду заканчивать вовремя».', f: 'B' },
      { who: 'Руководитель сервиса', t: '«Попробуем месяц в одном районе. Не пойдёт — вернёмся к старой схеме».', f: 'D' },
      { who: 'Мастер', t: '«Придётся планировать дорогу и не задерживаться у клиентов. Непросто, но понятно, на что идём».', f: 'X' }
    ],
    lv: { A: 2, B: 2, D: 2, X: 1 },
    weak: null,
    diag: 'Слабого звена не видно. Недовольство высокое, образ будущего привлекателен лично для мастеров, первые шаги безопасны: если не пойдёт, вернутся к старой схеме. Цену люди понимают и готовы платить. По формуле шансы хорошие.',
    options: [
      { t: 'Сразу перевести на интервалы все районы: раз все согласны, пилот не нужен', level: 'warn',
        fb: 'Поддержка есть, но именно пилот в одном районе делает первые шаги безопасными. Отказавшись от него, вы ослабите показатель, который сейчас в порядке.' },
      { t: 'Запускать пилот в одном районе, как договорились, и через месяц вместе разобрать, что получилось', level: 'ok',
        fb: 'Формула не показывает слабого звена — можно начинать. Разбор через месяц покажет, не просел ли какой-то показатель на деле.' },
      { t: 'Сначала провести для мастеров тренинг о том, зачем нужны изменения и каким станет сервис через три года', level: 'bad',
        fb: 'Мастера сами говорят, чем им станет лучше. Наращивать образ будущего, когда он уже есть, — тратить время.' }
    ]
  }
];

var state = { screen: 'intro', i: 0, step: 1, answers: [] };

/* ─── Типографика: неразрывные пробелы ─────────────────── */

function nb(s) {
  for (var k = 0; k < 2; k++) s = s.replace(/(^|[\s>(«"])([а-яёА-ЯЁ]{1,2}) /g, '$1$2 ');
  return s.replace(/ — /g, ' — ').replace(/(\d) (?=\d|[а-яё₽%])/g, '$1 ');
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ─── Ответы ────────────────────────────────────────────── */

function ans() {
  return state.answers[state.i] || (state.answers[state.i] = { lv: {}, checked: false });
}

function rowLevel(c, a, f) {
  var d = Math.abs(a.lv[f] - c.lv[f]);
  return d === 0 ? 'ok' : (d === 1 ? 'warn' : 'bad');
}

/* Итог диагноза: красный, если хоть одна шкала мимо на два уровня */
function diagLevel(c, a) {
  var worst = 'ok';
  for (var k = 0; k < FACTORS.length; k++) {
    var l = rowLevel(c, a, FACTORS[k]);
    if (l === 'bad') return 'bad';
    if (l === 'warn') worst = 'warn';
  }
  return worst;
}

function allSet(a) {
  for (var k = 0; k < FACTORS.length; k++) if (a.lv[FACTORS[k]] === undefined) return false;
  return true;
}

/* ─── Блоки экрана ──────────────────────────────────────── */

function formulaHtml(weak, big) {
  function f(x) { return '<span class="f' + (weak === x ? ' f--weak' : '') + '" data-f="' + x + '">' + x + '</span>'; }
  return '<div class="formula' + (big ? ' formula--big' : '') + '" id="formula">C = (' + f('A') + ' × ' + f('B') + ' × ' + f('D') + ') &gt; ' + f('X') + '</div>';
}

function quotesHtml(c, tagged) {
  var h = '<div class="quotes" id="quotes">';
  for (var k = 0; k < c.quotes.length; k++) {
    var q = c.quotes[k];
    var cls = 'quote' + (tagged ? ' quote--tagged' : '') + (tagged && q.f === c.weak ? ' quote--weak' : '');
    h += '<div class="' + cls + '" data-f="' + q.f + '"><span class="quote__tag">' + q.f + '</span>'
      + '<div><span class="quote__who">' + q.who + ':</span> ' + q.t + '</div></div>';
  }
  return h + '</div>';
}

function segHtml(f, a, c) {
  var names = f === 'X' ? LEVELS_X : LEVELS;
  var h = '<div class="seg' + (a.checked ? ' seg--locked' : '') + '" id="seg-' + f + '">';
  for (var v = 0; v < 3; v++) {
    var cls = segClass(f, v, a, c);
    h += '<button type="button" class="' + cls + '" onclick="setLv(\'' + f + '\',' + v + ')">' + names[v] + '</button>';
  }
  return h + '</div>';
}

function segClass(f, v, a, c) {
  var cls = a.lv[f] === v ? 'on' : '';
  if (a.checked) {
    if (a.lv[f] === v) cls += ' ' + rowLevel(c, a, f);
    else if (c.lv[f] === v) cls += ' right';
  }
  return cls;
}

function scalesHtml(c, a) {
  var h = '<div class="scales">';
  for (var k = 0; k < FACTORS.length; k++) {
    var f = FACTORS[k];
    h += '<div class="scale"><div class="scale__head"><b>' + f + '</b>' + FNAME[f] + '</div>' + segHtml(f, a, c) + '</div>';
  }
  return h + '</div>';
}

function optClass(k, a, c) {
  if (a.act === undefined) return 'card card--interactive opt';
  var cls = 'card opt opt--locked';
  if (c.options[k].level === 'ok') return cls + ' card--correct';
  if (k === a.act) return cls + (c.options[k].level === 'warn' ? ' card--warning' : ' card--wrong');
  return cls + ' card--dimmed';
}

function optionsHtml(c, a) {
  var h = '<div class="options">';
  for (var k = 0; k < c.options.length; k++) {
    h += '<div class="' + optClass(k, a, c) + '" data-opt="' + k + '" onclick="pick(' + k + ')">' + c.options[k].t + '</div>';
  }
  return h + '</div>';
}

var FB_CLASS = { ok: 'feedback--success', warn: 'feedback--warning', bad: 'feedback--error' };

function feedbackHtml(c, a) {
  var level, head, text;
  if (state.step === 1) {
    if (!a.checked) return '<div class="hint">Отметьте все четыре величины и нажмите «Проверить» — здесь появится разбор.</div>';
    level = diagLevel(c, a);
    var tail = c.weak ? 'слабое звено — ' + FWEAK[c.weak] : 'слабого звена нет';
    head = level === 'ok' ? 'Верно · ' + tail : (level === 'warn' ? 'Допустимо, но точнее: ' + tail : 'Неверно · ' + tail);
    text = c.diag;
  } else {
    if (a.act === undefined) return '<div class="hint">Выберите действие — здесь появится разбор.</div>';
    var o = c.options[a.act];
    level = o.level;
    var right = c.weak ? 'работать с ' + (c.weak === 'A' ? 'недовольством' : c.weak === 'B' ? 'образом будущего' : 'первыми шагами') : 'начинать с пилота';
    head = level === 'ok' ? 'Верно · ' + right : (level === 'warn' ? 'Допустимо, но лучше: ' + right : 'Неверно · здесь: ' + right);
    text = o.fb;
  }
  return nb('<div class="feedback ' + FB_CLASS[level] + '">'
    + '<div class="feedback__head">' + head + '</div>'
    + '<div>' + text + '</div>'
    + '</div>');
}

function progressHtml() {
  var done = state.i * 2 + (state.step - 1);
  return '<div class="progress">'
    + '<div class="progress__meta">'
    +   '<span class="progress__label">Компания</span>'
    +   '<span class="progress__fraction"><em>' + (state.i + 1) + '</em> / ' + CASES.length + '</span>'
    + '</div>'
    + '<div class="progress__track"><div class="progress__fill" style="width:' + (done / (CASES.length * 2) * 100) + '%"></div></div>'
    + '</div>';
}

/* ─── Экраны ────────────────────────────────────────────── */

function renderIntro() {
  var legend = [
    ['C', 'вероятность того, что изменения действительно произойдут'],
    ['A', 'уровень недовольства существующим положением дел'],
    ['B', 'сила стремления к изменениям, привлекательность образа будущего'],
    ['D', 'практическая полезность: чем меньше риск и чем менее разрушительны последствия, тем выше'],
    ['X', 'цена изменений: деньги, время, силы, репутация, отношения']
  ];
  var rows = '';
  for (var k = 0; k < legend.length; k++) rows += '<div class="legend-row"><b>' + legend[k][0] + '</b><span>' + cap(legend[k][1]) + '</span></div>';
  return '<div class="screen__body">'
    +   '<h1 class="page-title">Где слабое<span>звено</span></h1>'
    +   '<div class="divider"></div>'
    +   '<p class="lead-text">Четыре компании задумали изменения. По репликам сотрудников оцените величины формулы Глейчера, а затем решите, что делать руководителю.</p>'
    +   '<div class="mt-md">' + formulaHtml(null, true) + '<div class="formula-note">Изменения вероятны, когда произведение A, B и D перевешивает цену X.</div></div>'
    +   '<div class="legend-list mt-sm">' + rows + '</div>'
    +   '<div class="feedback feedback--info mt-md">Формула не считает точную вероятность. Она подсказывает, где искать слабое место.</div>'
    + '</div>'
    + '<button class="btn btn--primary btn--full mt-md" onclick="start()">Начать →</button>';
}

function renderQuestion() {
  var c = CASES[state.i], a = ans();
  var step1 = state.step === 1;
  var task = step1
    ? scalesHtml(c, a)
    : optionsHtml(c, a);
  return '<div class="screen__body">'
    +   progressHtml()
    +   '<div class="mt-sm">'
    +     '<div class="case-title">' + c.title + '</div>'
    +     '<p class="case-text">' + c.text + '</p>'
    +   '</div>'
    +   '<div class="mt-sm">' + quotesHtml(c, a.checked) + '</div>'
    +   '<div class="task-head mt-md">'
    +     '<div><div class="step-label">Шаг ' + state.step + ' из 2</div>'
    +     '<div class="question-text">' + (step1 ? 'Оцените величины по репликам' : 'Что делать руководителю?') + '</div></div>'
    +     formulaHtml(a.checked ? c.weak : null)
    +   '</div>'
    +   '<div id="taskbox" class="mt-sm">' + task + '</div>'
    +   '<div id="fbbox" class="fb-zone mt-sm">' + feedbackHtml(c, a) + '</div>'
    + '</div>'
    + '<div class="nav-bar">'
    +   '<button id="next-btn" class="btn btn--primary btn--full" onclick="primary()"' + (btnDisabled(a) ? ' disabled' : '') + '>' + btnText(a) + '</button>'
    + '</div>';
}

function btnText(a) {
  if (state.step === 1) return a.checked ? 'Далее: что делать →' : 'Проверить';
  return state.i === CASES.length - 1 ? 'К итогам →' : 'Следующая компания →';
}

function btnDisabled(a) {
  return state.step === 1 ? !allSet(a) : a.act === undefined;
}

var MARK = { ok: '✓', warn: '~', bad: '✕' };

function renderFinal() {
  var rows = '', missDiag = [], missAct = [];
  for (var n = 0; n < CASES.length; n++) {
    var c = CASES[n], a = state.answers[n];
    var ld = diagLevel(c, a), la = c.options[a.act].level;
    if (ld !== 'ok') missDiag.push(c.title.toLowerCase());
    if (la !== 'ok') missAct.push(c.title.toLowerCase());
    rows += '<div class="sum-row">'
      + '<div class="sum-row__name">' + c.title + '<small>' + (c.weak ? 'Слабое звено: ' + FWEAK[c.weak] : 'Слабого звена нет, можно начинать') + '</small></div>'
      + '<span class="mark mark--' + ld + '">' + MARK[ld] + '</span>'
      + '<span class="mark mark--' + la + '">' + MARK[la] + '</span>'
      + '</div>';
  }
  var verdict = missDiag.length === 0
    ? 'Слабое звено по репликам вы находите <b>уверенно</b>.'
    : 'В оценке величин стоит ещё раз посмотреть на кейсы: <b>' + missDiag.join(', ') + '</b>.';
  verdict += ' ' + (missAct.length === 0
    ? 'И выбираете, <b>с чем работать</b>, точно.'
    : 'С выбором действия расходятся кейсы: <b>' + missAct.join(', ') + '</b>.');
  return '<div class="screen__body">'
    +   '<h2 class="section-title">Ваш разбор</h2>'
    +   '<div class="divider"></div>'
    +   '<div class="sum-head"><span>Компания</span><span>Оценка · действие</span></div>'
    +   rows
    +   '<p class="sum-verdict mt-sm">' + verdict + '</p>'
    +   '<div class="legend-box">'
    +     '<span class="legend-tag">Итог</span>'
    +     'Формула Глейчера — не точный расчёт, а способ задать четыре вопроса и найти <strong>слабое звено</strong>. Величины перемножаются, поэтому если одна близка к нулю, усиливать остальные бесполезно. <strong>Работайте с самым слабым показателем</strong>, а если слабого не видно — начинайте.'
    +   '</div>'
    + '</div>'
    + '<button class="btn btn--secondary btn--full" onclick="restart()">Пройти заново</button>';
}

/* ─── Управление ────────────────────────────────────────── */

function render() {
  var body;
  if (state.screen === 'intro') body = renderIntro();
  else if (state.screen === 'q') body = renderQuestion();
  else body = renderFinal();
  document.getElementById('app').innerHTML = '<div class="page-wrap--compact screen anim-fade-up">' + nb(body) + '</div>';
  notifyHeight();
}

function start() {
  state.screen = 'q';
  state.i = 0;
  state.step = 1;
  state.answers = [];
  render();
}

/* Выбор уровня обновляет только свою шкалу и кнопку: экран не вздрагивает */
function setLv(f, v) {
  var a = ans(), c = CASES[state.i];
  if (a.checked) return;
  a.lv[f] = v;
  var btns = document.querySelectorAll('#seg-' + f + ' button');
  for (var k = 0; k < btns.length; k++) btns[k].className = segClass(f, k, a, c);
  document.getElementById('next-btn').disabled = !allSet(a);
}

/* Проверка: красим шкалы, отмечаем реплики и слабое звено в формуле */
function check() {
  var a = ans(), c = CASES[state.i];
  a.checked = true;
  for (var n = 0; n < FACTORS.length; n++) {
    var f = FACTORS[n];
    document.getElementById('seg-' + f).className = 'seg seg--locked';
    var btns = document.querySelectorAll('#seg-' + f + ' button');
    for (var k = 0; k < btns.length; k++) btns[k].className = segClass(f, k, a, c);
  }
  var qs = document.querySelectorAll('#quotes .quote');
  for (var q = 0; q < qs.length; q++) {
    qs[q].className = 'quote quote--tagged' + (qs[q].getAttribute('data-f') === c.weak ? ' quote--weak' : '');
  }
  var fs = document.querySelectorAll('#formula .f');
  for (var m = 0; m < fs.length; m++) {
    fs[m].className = 'f' + (fs[m].getAttribute('data-f') === c.weak ? ' f--weak' : '');
  }
  document.getElementById('fbbox').innerHTML = feedbackHtml(c, a);
  document.getElementById('next-btn').textContent = btnText(a);
  notifyHeight();
}

function pick(idx) {
  var a = ans(), c = CASES[state.i];
  if (a.act !== undefined) return;
  a.act = idx;
  var opts = document.querySelectorAll('#taskbox [data-opt]');
  for (var k = 0; k < opts.length; k++) {
    opts[k].className = optClass(k, a, c);
    opts[k].onclick = null;
  }
  document.getElementById('fbbox').innerHTML = feedbackHtml(c, a);
  document.getElementById('next-btn').disabled = false;
  notifyHeight();
}

function primary() {
  var a = ans();
  if (state.step === 1 && !a.checked) { check(); return; }
  if (state.step === 1) state.step = 2;
  else if (state.i === CASES.length - 1) state.screen = 'final';
  else { state.i++; state.step = 1; }
  render();
}

function restart() {
  state.screen = 'intro';
  state.i = 0;
  state.step = 1;
  state.answers = [];
  render();
}

render();
</script>
</body>
</html>
